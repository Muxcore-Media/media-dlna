name: CI
on:
  push: { branches: [master, main] }
  pull_request: { branches: [master, main] }
env:
  REGISTRY: ghcr.io
  GOPRIVATE: github.com/Muxcore-Media/*
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - run: go test -count=1 -timeout 10m ./...
  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - run: |
          go build -o /dev/null ./cmd/module
          go vet ./...
